# פריסה אוטומטית ל-Cloudflare Workers בכל push ל-main
# דורש שני Secrets בריפו (Settings ← Secrets and variables ← Actions):
#   CLOUDFLARE_API_TOKEN  — טוקן מחשבון ה-Cloudflare של gebmpro.co.il (הרשאות: Workers Scripts:Edit + Zone)
#   CLOUDFLARE_ACCOUNT_ID — מזהה החשבון (Cloudflare Dashboard ← Overview, בצד ימין)
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build frontend
        run: |
          cd frontend
          npm ci
          npx vite build

      - name: Deploy Worker (summer-vacation)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
